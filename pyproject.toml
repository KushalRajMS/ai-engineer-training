[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineer-training"
version = "0.1.0"
description = "AI engineer training project foundation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx",
  "python-dotenv",
  "pydantic",
  "tenacity",
  "pytest",
  "pytest-cov",
  "ruff",
  "typer",
  "rich",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
